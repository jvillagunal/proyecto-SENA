<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - GrigoriPerelmánApp (Evidencia)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100 font-[Inter]">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-blue-800">GrigoriPerelmánApp</h1>
                <p class="text-gray-600 mt-2">Crea tu cuenta</p>
            </div>
            <form id="registerForm">
                <div class="mb-4">
                    <label for="name" class="block text-gray-700 font-medium mb-2">Nombre completo</label>
                    <input type="text" id="name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 font-medium mb-2">Correo electrónico</label>
                    <input type="email" id="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                    <p id="email-error" class="text-red-500 text-sm mt-1 hidden">Ingrese un correo válido</p>
                </div>
                <div class="mb-4">
                    <label for="password" class="block text-gray-700 font-medium mb-2">Contraseña</label>
                    <div class="relative">
                        <input type="password" id="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                        <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 px-3 text-gray-500">Mostrar</button>
                    </div>
                    <p class="text-sm text-gray-500 mt-1">Mínimo 8 caracteres, una mayúscula y un número</p>
                </div>
                <div class="mb-6">
                    <label for="confirm-password" class="block text-gray-700 font-medium mb-2">Confirmar contraseña</label>
                    <input type="password" id="confirm-password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">Registrarse</button>
            </form>
            <p class="text-center text-gray-600 mt-6">
                ¿Ya tienes cuenta? <a href="login.html" class="text-blue-600 hover:underline">Iniciar sesión</a>
            </p>
        </div>
    </div>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
