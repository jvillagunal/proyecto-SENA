<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - GrigoriPerelmánApp (Evidencia)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100 font-[Inter]">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-blue-800">GrigoriPerelmánApp</h1>
                <p class="text-gray-600 mt-2">Accede a tu cuenta</p>
            </div>
            <div id="step1">
                <form id="loginForm">
                    <div class="mb-4">
                        <label for="email" class="block text-gray-700 font-medium mb-2">Correo electrónico</label>
                        <input type="email" id="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div class="mb-6">
                        <label for="password" class="block text-gray-700 font-medium mb-2">Contraseña</label>
                        <input type="password" id="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">Iniciar sesión</button>
                </form>
                <p class="text-center mt-6"><a href="#" class="text-blue-600 hover:underline">¿Olvidaste tu contraseña?</a></p>
            </div>
            <div id="step2" class="hidden">
                <form id="twoFactorForm">
                    <p class="mb-4 text-gray-700">Ingresa el código de 6 dígitos enviado a tu correo:</p>
                    <div class="mb-6">
                        <input type="text" id="code" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-center text-2xl tracking-widest" maxlength="6" pattern="[0-9]*" inputmode="numeric">
                    </div>
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg">Verificar</button>
                    <button type="button" id="resendCode" class="w-full mt-2 text-blue-600 hover:underline">Reenviar código</button>
                </form>
            </div>
            <p class="text-center text-gray-600 mt-6">
                ¿No tienes cuenta? <a href="register.html" class="text-blue-600 hover:underline">Regístrate</a>
            </p>
        </div>
    </div>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
