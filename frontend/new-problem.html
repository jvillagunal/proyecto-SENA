<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Problema - GrigoriPerelmánApp (Evidencia)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100 font-[Inter]">
    <div class="flex flex-col min-h-screen">
        <header class="bg-blue-800 text-white shadow-md">
            <div class="container mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <span class="font-bold text-xl">GrigoriPerelmánApp</span>
                </div>
                <div class="hidden md:flex space-x-6">
                    <a href="dashboard.html" class="hover:text-blue-200">Inicio</a>
                    <a href="new-problem.html" class="hover:text-blue-200">Nuevo problema</a>
                    <a href="history.html" class="hover:text-blue-200">Historial</a>
                    <a href="profile.html" class="hover:text-blue-200">Perfil</a>
                </div>
                <button id="mobileMenuBtn" class="md:hidden"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
            </div>
            <div id="mobileMenu" class="hidden md:hidden bg-blue-700 p-4">
                <a href="dashboard.html" class="block py-2">Inicio</a>
                <a href="new-problem.html" class="block py-2">Nuevo problema</a>
                <a href="history.html" class="block py-2">Historial</a>
                <a href="profile.html" class="block py-2">Perfil</a>
            </div>
        </header>

        <main class="flex-grow container mx-auto px-4 py-8">
            <div class="bg-white rounded-lg shadow-lg p-6 max-w-3xl mx-auto">
                <h1 class="text-2xl font-bold text-blue-800 mb-6">Nuevo problema matemático</h1>
                <form id="problemForm">
                    <div class="mb-4">
                        <label for="latex" class="block font-medium mb-2">Ecuación (formato LaTeX):</label>
                        <textarea id="latex" rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-lg font-mono" placeholder="Ej: x^2 + 2x + 1 = 0"></textarea>
                        <div id="preview" class="mt-2 p-2 bg-gray-100 rounded-lg">Vista previa: </div>
                    </div>
                    <div class="flex flex-wrap gap-4 mb-6">
                        <button type="button" id="ocrBtn" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg flex items-center gap-2">Escanear con OCR</button>
                        <button type="button" id="uploadBtn" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg flex items-center gap-2">Cargar archivo</button>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">Resolver</button>
                </form>
            </div>
        </main>

        <footer class="bg-gray-800 text-white text-center py-4 mt-8">
            <p>&copy; 2026 GrigoriPerelmánApp</p>
        </footer>
    </div>
    <script src="js/utils.js"></script>
    <script src="js/problem.js"></script>
</body>
</html>
