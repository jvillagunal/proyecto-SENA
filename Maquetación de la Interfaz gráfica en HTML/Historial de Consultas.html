<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial - GrigoriPerelmánApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100 font-[Inter]">
    <div class="container mx-auto max-w-4xl p-6">
        <div class="bg-white rounded-lg shadow-lg p-6">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-blue-800">Historial de consultas</h1>
                <div class="relative">
                    <input type="text" placeholder="Buscar..." class="border rounded-lg py-2 px-4 pl-10">
                    <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full border-collapse">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="p-2 text-left">Fecha</th>
                            <th class="p-2 text-left">Ecuación</th>
                            <th class="p-2 text-left">Tipo</th>
                            <th class="p-2 text-left">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-b">
                            <td class="p-2">07/06/2025</td>
                            <td class="p-2 font-mono">x^2 - 5x + 6 = 0</td>
                            <td class="p-2">Cuadrática</td>
                            <td class="p-2">
                                <button class="text-blue-600 hover:underline mr-2">Ver</button>
                                <button class="text-red-600 hover:underline">Eliminar</button>
                            </td>
                        </tr>
                        <tr class="border-b">
                            <td class="p-2">06/06/2025</td>
                            <td class="p-2 font-mono">2x + 3 = 7</td>
                            <td class="p-2">Lineal</td>
                            <td class="p-2">
                                <button class="text-blue-600 hover:underline mr-2">Ver</button>
                                <button class="text-red-600 hover:underline">Eliminar</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="mt-6 text-center">
                <button class="text-blue-600 hover:underline">Cargar más</button>
            </div>
        </div>
    </div>
</body>
</html>
