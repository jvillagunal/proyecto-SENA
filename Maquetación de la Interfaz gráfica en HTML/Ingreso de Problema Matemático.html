<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Problema - GrigoriPerelmánApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100 font-[Inter]">
    <div class="container mx-auto max-w-3xl p-6">
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h1 class="text-2xl font-bold text-blue-800 mb-6">Nuevo problema matemático</h1>
            <form id="problemForm">
                <div class="mb-4">
                    <label for="latex-input" class="block font-medium mb-2">Ecuación (formato LaTeX):</label>
                    <textarea id="latex-input" rows="3" class="w-full px-4 py-2 border rounded-lg font-mono" placeholder="Ej: x^2 + 2x + 1 = 0"></textarea>
                    <div class="mt-2 p-2 bg-gray-100 rounded-lg" id="preview">Vista previa: </div>
                </div>
                <div class="flex flex-wrap gap-4 mb-6">
                    <button type="button" id="ocrBtn" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg"><i class="fas fa-camera mr-2"></i>Escanear con OCR</button>
                    <button type="button" id="uploadBtn" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg"><i class="fas fa-upload mr-2"></i>Cargar archivo</button>
                </div>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg">Resolver</button>
            </form>
        </div>
    </div>
    <script>
        const textarea = document.getElementById('latex-input');
        const preview = document.getElementById('preview');
        textarea.addEventListener('input', () => {
            preview.innerHTML = `Vista previa: \\(${textarea.value}\\)`;
            // Aquí se integraría MathJax para renderizar LaTeX
        });
        document.getElementById('problemForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Procesando ecuación...');
            // Redirigir a la vista de solución
        });
        document.getElementById('ocrBtn').addEventListener('click', () => {
            alert('Funcionalidad de OCR: se abriría la cámara del dispositivo.');
        });
        document.getElementById('uploadBtn').addEventListener('click', () => {
            alert('Cargar archivo: se abriría el selector de archivos.');
        });
    </script>
    <!-- Incluir MathJax para renderizar LaTeX -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</body>
</html>
