<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - GrigoriPerelmánApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .focus-ring:focus { outline: 2px solid #3b82f6; outline-offset: 2px; }
    </style>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-blue-800">GrigoriPerelmánApp</h1>
                <p class="text-gray-600 mt-2">Crea tu cuenta para acceder a soluciones matemáticas paso a paso</p>
            </div>
            <form id="registerForm" action="#" method="POST">
                <div class="mb-4">
                    <label for="name" class="block text-gray-700 font-medium mb-2">Nombre completo</label>
                    <input type="text" id="name" name="name" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus-ring focus:border-blue-500"
                           aria-required="true">
                </div>
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 font-medium mb-2">Correo electrónico</label>
                    <input type="email" id="email" name="email" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus-ring focus:border-blue-500"
                           aria-required="true">
                    <p id="email-error" class="text-red-500 text-sm mt-1 hidden">Ingrese un correo válido</p>
                </div>
                <div class="mb-4">
                    <label for="password" class="block text-gray-700 font-medium mb-2">Contraseña</label>
                    <div class="relative">
                        <input type="password" id="password" name="password" required 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus-ring focus:border-blue-500"
                               aria-required="true">
                        <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 px-3 text-gray-500">Mostrar</button>
                    </div>
                    <p class="text-sm text-gray-500 mt-1">Mínimo 8 caracteres, una mayúscula y un número</p>
                </div>
                <div class="mb-6">
                    <label for="confirm-password" class="block text-gray-700 font-medium mb-2">Confirmar contraseña</label>
                    <input type="password" id="confirm-password" name="confirm-password" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus-ring focus:border-blue-500"
                           aria-required="true">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition duration-200">Registrarse</button>
            </form>
            <p class="text-center text-gray-600 mt-6">
                ¿Ya tienes cuenta? <a href="login.html" class="text-blue-600 hover:underline">Iniciar sesión</a>
            </p>
        </div>
    </div>
    <script>
        // Validación simple y toggle de contraseña
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        toggleBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleBtn.textContent = type === 'password' ? 'Mostrar' : 'Ocultar';
        });
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // Simulación de registro exitoso
            alert('Registro exitoso. Revisa tu correo para confirmar la cuenta.');
        });
    </script>
</body>
</html>
